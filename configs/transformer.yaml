#Temporary YAML config for transformer
model:
  name: "transformer"
  input_dim: 1
  d_model: 128 
  num_layers: 4
  num_heads: 8 
  max_len: 96
  positional_encoding: "sinusoidal"
  learnable_pos_encoding: false
  d_ff: 512
  dropout: 0.1
  regression_head:
    output_dim: 1
    pooling: "mean"

data:
  input_data_path: "data/experiments/"

training:
  batch_size: 32
  num_workers: 0
  shuffle: true
  save_best_model: true
  checkpoint_dir : "checkpoints/transformer/"
  num_epochs: 10
  patience: 10
  optimiser: "adamw"
  learning_rate: 0.0001
  weight_decay: 1e-4
  early_stopping: true
  loss_function: "MSELoss"
  scheduler:
    use_scheduler: true
    type: "ReduceLROnPlateau"
    patience: 5
    factor: 0.1
    mode: "min"
    step_size: 10
    gamma: 0.1
  gradient_clipping:
    use_clipping: true
    max_norm: 1.0 
  tensorboard_log_dir: "tensorboard_logs/transformer/"

logging:
  log_interval: 50
  save_model: true
  save_path: "models/transformer/"