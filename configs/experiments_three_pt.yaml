# Three-Point Correlator Experiments (K meson, T19 only)
# Each experiment maps input correlators to target correlators

experiments:
  # LocalScalar Experiments (1-3)
  1:
    name: "LocalScalar qmax to qsq0"
    description: "Predicting K meson 3pt correlators at q^2=0 from highest momentum (localscalar, T19)"
    type: "3pt"
    operator: "localscalar"
    T_value: 19
    input_path: "data/processed/unaveraged_data"
    output_path: "data/experiments/Three_pt_ML_localscalar_T19_qmax_to_qsq0_Experiment"
    input_files: ["localscalar_3pt_T19.csv"]
    target_file: "localscalar_3pt_T19_qsq0.csv"

  2:
    name: "LocalScalar qmax to qmaxby3"
    description: "Predicting K meson 3pt correlators at q^2=q^2_max/3 from highest momentum (localscalar, T19)"
    type: "3pt"
    operator: "localscalar"
    T_value: 19
    input_path: "data/processed/unaveraged_data"
    output_path: "data/experiments/Three_pt_ML_localscalar_T19_qmax_to_qmaxby3_Experiment"
    input_files: ["localscalar_3pt_T19.csv"]
    target_file: "localscalar_3pt_T19_qmaxby3.csv"

  3:
    name: "LocalScalar qmax to 2qmaxby3"
    description: "Predicting K meson 3pt correlators at q^2=2*q^2_max/3 from highest momentum (localscalar, T19)"
    type: "3pt"
    operator: "localscalar"
    T_value: 19
    input_path: "data/processed/unaveraged_data"
    output_path: "data/experiments/Three_pt_ML_localscalar_T19_qmax_to_2qmaxby3_Experiment"
    input_files: ["localscalar_3pt_T19.csv"]
    target_file: "localscalar_3pt_T19_2qmaxby3.csv"

  # LocalTempVector Experiments (4-6)
  4:
    name: "LocalTempVector qmax to qsq0"
    description: "Predicting K meson 3pt correlators at q^2=0 from highest momentum (localtempvector, T19)"
    type: "3pt"
    operator: "localtempvector"
    T_value: 19
    input_path: "data/processed/unaveraged_data"
    output_path: "data/experiments/Three_pt_ML_localtempvector_T19_qmax_to_qsq0_Experiment"
    input_files: ["localtempvector_3pt_T19.csv"]
    target_file: "localtempvector_3pt_T19_qsq0.csv"

  5:
    name: "LocalTempVector qmax to qmaxby3"
    description: "Predicting K meson 3pt correlators at q^2=q^2_max/3 from highest momentum (localtempvector, T19)"
    type: "3pt"
    operator: "localtempvector"
    T_value: 19
    input_path: "data/processed/unaveraged_data"
    output_path: "data/experiments/Three_pt_ML_localtempvector_T19_qmax_to_qmaxby3_Experiment"
    input_files: ["localtempvector_3pt_T19.csv"]
    target_file: "localtempvector_3pt_T19_qmaxby3.csv"

  6:
    name: "LocalTempVector qmax to 2qmaxby3"
    description: "Predicting K meson 3pt correlators at q^2=2*q^2_max/3 from highest momentum (localtempvector, T19)"
    type: "3pt"
    operator: "localtempvector"
    T_value: 19
    input_path: "data/processed/unaveraged_data"
    output_path: "data/experiments/Three_pt_ML_localtempvector_T19_qmax_to_2qmaxby3_Experiment"
    input_files: ["localtempvector_3pt_T19.csv"]
    target_file: "localtempvector_3pt_T19_2qmaxby3.csv"

  # Transfer Learning Experiments (7-9): LocalScalar pretrained -> LocalTempVector data
  7:
    name: "Transfer: LocalScalar->LocalTempVector qmax to qsq0"
    description: "Transfer learning from localscalar to localtempvector for q^2=0 prediction"
    type: "3pt"
    operator: "localtempvector"
    T_value: 19
    input_path: "data/processed/unaveraged_data"
    output_path: "data/experiments/Three_pt_ML_transfer_T19_qmax_to_qsq0_Experiment"
    input_files: ["localtempvector_3pt_T19.csv"]
    target_file: "localtempvector_3pt_T19_qsq0.csv"
    transfer_learning:
      pretrained_experiment: 1  # LocalScalar qmax to qsq0
      freeze_encoder: true  # Can be overridden via CLI

  8:
    name: "Transfer: LocalScalar->LocalTempVector qmax to qmaxby3"
    description: "Transfer learning from localscalar to localtempvector for q^2=q^2_max/3 prediction"
    type: "3pt"
    operator: "localtempvector"
    T_value: 19
    input_path: "data/processed/unaveraged_data"
    output_path: "data/experiments/Three_pt_ML_transfer_T19_qmax_to_qmaxby3_Experiment"
    input_files: ["localtempvector_3pt_T19.csv"]
    target_file: "localtempvector_3pt_T19_qmaxby3.csv"
    transfer_learning:
      pretrained_experiment: 2  # LocalScalar qmax to qmaxby3
      freeze_encoder: true

  9:
    name: "Transfer: LocalScalar->LocalTempVector qmax to 2qmaxby3"
    description: "Transfer learning from localscalar to localtempvector for q^2=2*q^2_max/3 prediction"
    type: "3pt"
    operator: "localtempvector"
    T_value: 19
    input_path: "data/processed/unaveraged_data"
    output_path: "data/experiments/Three_pt_ML_transfer_T19_qmax_to_2qmaxby3_Experiment"
    input_files: ["localtempvector_3pt_T19.csv"]
    target_file: "localtempvector_3pt_T19_2qmaxby3.csv"
    transfer_learning:
      pretrained_experiment: 3  # LocalScalar qmax to 2qmaxby3
      freeze_encoder: true

# Data split fractions
splits:
  train: 0.15
  eval: 0.15
  bias_correction: 0.15
  test: 0.55

# Global settings
settings:
  time_sources: 4
  seed: 42
