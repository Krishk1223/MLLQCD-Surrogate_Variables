# Three-Point Correlator Experiments (K meson, T19 only)
# Each experiment maps LocalScalar input to LocalTempVector target

experiments:
  1:
    name: "LocalScalar to LocalTempVector qsq0"
    description: "Predicting localtempvector 3pt at q^2=0 from localscalar qmax (T19)"
    type: "3pt"
    operator: "localscalar->localtempvector"
    T_value: 19
    input_path: "data/processed/unaveraged_data"
    output_path: "data/experiments/Three_pt_ML_scalar_to_vector_qsq0_Experiment"
    input_files: ["localscalar_3pt_T19.csv"]
    target_file: "localtempvector_3pt_T19_qsq0.csv"

  2:
    name: "LocalScalar to LocalTempVector qmaxby3"
    description: "Predicting localtempvector 3pt at q^2=q^2_max/3 from localscalar qmax (T19)"
    type: "3pt"
    operator: "localscalar->localtempvector"
    T_value: 19
    input_path: "data/processed/unaveraged_data"
    output_path: "data/experiments/Three_pt_ML_scalar_to_vector_qmaxby3_Experiment"
    input_files: ["localscalar_3pt_T19.csv"]
    target_file: "localtempvector_3pt_T19_qmaxby3.csv"

  3:
    name: "LocalScalar to LocalTempVector 2qmaxby3"
    description: "Predicting localtempvector 3pt at q^2=2*q^2_max/3 from localscalar qmax (T19)"
    type: "3pt"
    operator: "localscalar->localtempvector"
    T_value: 19
    input_path: "data/processed/unaveraged_data"
    output_path: "data/experiments/Three_pt_ML_scalar_to_vector_2qmaxby3_Experiment"
    input_files: ["localscalar_3pt_T19.csv"]
    target_file: "localtempvector_3pt_T19_2qmaxby3.csv"

  4:
    name: "LocalScalar to LocalTempVector qmax"
    description: "Predicting localtempvector 3pt at q^2_max from localscalar qmax (T19)"
    type: "3pt"
    operator: "localscalar->localtempvector"
    T_value: 19
    input_path: "data/processed/unaveraged_data"
    output_path: "data/experiments/Three_pt_ML_scalar_to_vector_qmax_Experiment"
    input_files: ["localscalar_3pt_T19.csv"]
    target_file: "localtempvector_3pt_T19.csv"

splits:
  train: 0.15
  eval: 0.15
  bias_correction: 0.15
  test: 0.55

settings:
  time_sources: 4
  seed: 42
