model:
  name: "mlp"
  hidden_dims: [256, 128, 64]
  dropout: 0.1

data:
  input_data_path: "data/experiments/"

training:
  batch_size: 64
  num_epochs: 100
  early_stopping_patience: 15
  learning_rate: 0.001
  weight_decay: 0.0001

logging:
  log_interval: 10
  save_model: true
  save_best_model: true
